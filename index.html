<style>
  /* Intro only; shared page styles live in assets/site.css */
  :root {
    /* Peo's shirt green (same hue as the reference photo, brightened so it reads on black) */
    --peo-green: #63c125;
    --term-bg: #000000;
  }
  body.intro-active { overflow: hidden; }

  /* ── Intro terminal ── */
  #intro {
    position: fixed; inset: 0; z-index: 1000;
    background: var(--term-bg);
  }
  #term {
    padding: 16px 20px;
    color: var(--peo-green);
    font: 18px/1.5 var(--term-font);
    white-space: pre-wrap;
  }
  /* The closing flood: copies of the last line filling the screen */
  #flood { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  #flood span {
    position: absolute; white-space: pre;
    color: var(--peo-green); font: 18px/1.5 var(--term-font);
  }
  .cursor { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .yn { display: inline-flex; gap: 0; }
  .yn button {
    font: inherit; color: var(--peo-green); background: transparent;
    border: 0; padding: 0 2px; cursor: pointer;
  }
  .yn button[aria-pressed="true"] { background: var(--peo-green); color: var(--term-bg); }
  .yn button:focus-visible { outline: 1px dashed var(--peo-green); outline-offset: 2px; }
  .yn .slash { padding: 0 1px; }

  #skip {
    position: fixed; right: 16px; bottom: 16px;
    font: 14px var(--term-font); color: var(--peo-green);
    background: transparent; border: 1px solid var(--peo-green);
    padding: 6px 12px; cursor: pointer;
  }
  #skip:focus-visible { outline: 2px solid var(--peo-green); outline-offset: 2px; }

  @media (max-width: 480px) { #term, #flood span { font-size: 15px; } #term { padding: 16px; } }
  @media (prefers-reduced-motion: reduce) {
    .cursor { animation: none; }
  }

</style>
</head>
<body class="intro-active" data-page="home" data-safe="10">

<div id="intro" role="dialog" aria-modal="true" aria-label="Access check">
  <div id="term" aria-live="polite"></div>
  <button id="skip" type="button">Skip</button>
</div>

<header class="banner" id="site-banner"></header>

<div class="layout">
  <nav class="side" id="site-nav" aria-label="Site"></nav>

  <main>

<script src="assets/site.js?v=54" data-root=""></script>

<script>
// ── Settings: adjust speed here (milliseconds) ──
const TYPE_MS = 55;     // per typed character
const ERASE_MS = 18;    // per erased character (held backspace)
const LINE_PAUSE = 600; // pause after each line
const DOT_PAUSE = 280;  // extra pause after each ". " in the dotted lines
const FLOOD_MS = 2600;  // how long the closing line takes to cover the screen
const FLOOD_HOLD = 500; // how long the covered screen stays before fading
const FLOOD_EXTRA = 0.5; // extra scattered copies, as a share of the grid (more = more chaotic)
const FADE_MS = 1000;   // how long the final fade to the page takes

const LINES = ["CONNECTING. . .", "Verifying. . ."];
const QUESTION = "Are you sure you want to do this? ";
const FAREWELL = "May Peo be with you.";
// Easter eggs: on a rare visit, one of these replaces a single copy hidden in the flood.
const EGG_CHANCE = 0.01; // 1% of visits
const EASTER_EGGS = [
  "May Bablate be with you.",
  "May Poe be with you.",
  "May Wes be with you.",
  "Mogu?"
];
const DENIED = "ACCESS DENIED.";
const DENIED_URL = "https://www.google.com"; // where "N" sends visitors

const intro = document.getElementById("intro");
const term = document.getElementById("term");
const skipBtn = document.getElementById("skip");
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const wait = ms => new Promise(r => setTimeout(r, reduce ? 0 : ms));

// The terminal is a list of text lines plus a blinking cursor at the end.
let lines = [""];
let tail = null; // optional element (the Y/N choice) shown after the last line
function render() {
  term.textContent = lines.join("\n");
  if (tail) term.appendChild(tail);
  const c = document.createElement("span");
  c.className = "cursor"; c.textContent = "_";
  term.appendChild(c);
}

async function type(text) {
  for (const ch of text) {
    if (done) return;
    lines[lines.length - 1] += ch; render();
    await wait(TYPE_MS + (ch === "." ? DOT_PAUSE : 0));
  }
}
async function newline() { lines.push(""); render(); }
async function eraseAll() {
  tail = null;
  while (!done && (lines.length > 1 || lines[0].length)) {
    const last = lines.length - 1;
    if (lines[last].length) lines[last] = lines[last].slice(0, -1);
    else lines.pop();
    render();
    await wait(ERASE_MS);
  }
}

// Y/N prompt: arrow keys switch, Enter confirms, or click an option.
function askYesNo() {
  return new Promise(resolve => {
    const wrap = document.createElement("span");
    wrap.className = "yn";
    wrap.setAttribute("role", "group");
    wrap.setAttribute("aria-label", "Yes or no");
    const y = Object.assign(document.createElement("button"), { type: "button", textContent: "Y" });
    const slash = Object.assign(document.createElement("span"), { className: "slash", textContent: "/" });
    const n = Object.assign(document.createElement("button"), { type: "button", textContent: "N" });
    y.setAttribute("aria-label", "Yes"); n.setAttribute("aria-label", "No");
    wrap.append(y, slash, n);
    let choice = "Y";
    const show = () => { y.setAttribute("aria-pressed", choice === "Y"); n.setAttribute("aria-pressed", choice === "N"); };
    const pick = c => { cleanup(); resolve(c); };
    const onKey = e => {
      if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(e.key)) {
        e.preventDefault(); choice = choice === "Y" ? "N" : "Y"; show(); (choice === "Y" ? y : n).focus();
      } else if (e.key === "Enter") { e.preventDefault(); pick(choice); }
    };
    function cleanup() { document.removeEventListener("keydown", onKey); }
    y.addEventListener("click", () => pick("Y"));
    n.addEventListener("click", () => pick("N"));
    y.addEventListener("mouseenter", () => { choice = "Y"; show(); });
    n.addEventListener("mouseenter", () => { choice = "N"; show(); });
    document.addEventListener("keydown", onKey);
    show();
    tail = wrap; render(); y.focus();
  });
}

let done = false;
async function run() {
  await wait(400);
  for (const line of LINES) {
    await type(line); await wait(LINE_PAUSE); await newline();
  }
  await type(QUESTION);
  const answer = await askYesNo();
  if (done) return;
  if (answer === "N") {
    // "N": erase everything, deny access, and send the visitor away.
    await wait(250);
    await eraseAll();
    await wait(LINE_PAUSE);
    await type(DENIED);
    await wait(1200);
    if (!done) location.replace(DENIED_URL);
    return;
  }
  await wait(250);
  await eraseAll();
  await wait(LINE_PAUSE);
  await type(FAREWELL);
  await wait(900);
  await flood();
  finish(true);
}

// Copies of the closing line pop up all over the screen, faster and faster, until it's covered.
function flood() {
  if (reduce || done) return Promise.resolve();
  const layer = document.createElement("div");
  layer.id = "flood";
  layer.setAttribute("aria-hidden", "true");
  intro.appendChild(layer);

  // Measure one copy, then lay out an overlapping grid (half a line apart sideways,
  // slightly less than a line apart vertically) so no black is left anywhere.
  const probe = document.createElement("span");
  probe.textContent = FAREWELL;
  layer.appendChild(probe);
  const w = probe.offsetWidth, h = probe.offsetHeight;
  probe.remove();
  const stepX = w * 0.5, stepY = h * 0.8;
  const cols = Math.ceil((innerWidth + w) / stepX) + 1, rows = Math.ceil(innerHeight / stepY) + 1;
  const spots = [];
  for (let r = 0; r < rows; r++)
    for (let c = 0; c < cols; c++)
      spots.push([c * stepX - w * 0.5 - Math.random() * stepX * 0.5, r * stepY - Math.random() * stepY * 0.5]);
  // A burst of extra copies scattered anywhere, for a more chaotic finish.
  const extra = Math.floor(spots.length * FLOOD_EXTRA);
  for (let i = 0; i < extra; i++) spots.push([Math.random() * innerWidth - w * 0.5, Math.random() * innerHeight - h * 0.5]);
  for (let i = spots.length - 1; i > 0; i--) { // shuffle the order they appear in
    const j = Math.floor(Math.random() * (i + 1));
    [spots[i], spots[j]] = [spots[j], spots[i]];
  }

  // On a rare visit, one random easter egg replaces one of the last copies, drawn on top so it stays legible.
  const eggs = new Map();
  if (Math.random() < EGG_CHANCE) {
    const text = EASTER_EGGS[Math.floor(Math.random() * EASTER_EGGS.length)];
    const late = Math.floor(spots.length * 0.85);
    eggs.set(late + Math.floor(Math.random() * (spots.length - late)), text);
  }

  return new Promise(resolve => {
    const start = performance.now();
    let shown = 0;
    (function frame(now) {
      if (done) return resolve();
      // The number shown grows with the square of elapsed time: slow at first, then rushing in.
      const due = Math.min(spots.length, Math.floor(spots.length * ((now - start) / FLOOD_MS) ** 2));
      const batch = document.createDocumentFragment();
      for (; shown < due; shown++) {
        const s = document.createElement("span");
        s.textContent = eggs.get(shown) || FAREWELL;
        if (eggs.has(shown)) s.style.zIndex = "1";
        s.style.left = spots[shown][0] + "px";
        s.style.top = spots[shown][1] + "px";
        batch.appendChild(s);
      }
      layer.appendChild(batch);
      if (shown < spots.length) requestAnimationFrame(frame);
      else setTimeout(resolve, FLOOD_HOLD);
    })(start);
  });
}

// Fades everything away to reveal the page (skipping removes it instantly).
function finish(fade) {
  done = true;
  try { sessionStorage.setItem("peoIntroSeen", "1"); } catch (e) {}
  const reveal = () => { intro.remove(); document.body.classList.remove("intro-active"); };
  if (fade !== true || reduce) return reveal();
  intro.style.transition = `opacity ${FADE_MS}ms ease`;
  requestAnimationFrame(() => { intro.style.opacity = "0"; });
  setTimeout(reveal, FADE_MS + 50);
}

skipBtn.addEventListener("click", () => finish());
document.addEventListener("keydown", e => { if (e.key === "Escape" && document.getElementById("intro")) finish(); });

// Once per visit: the intro is skipped if it already played in this browser tab session.
let seen = false;
try { seen = sessionStorage.getItem("peoIntroSeen") === "1"; } catch (e) {}
if (seen) finish(); else run();
</script>
</body>
